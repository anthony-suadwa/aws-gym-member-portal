{% extends "base.html" %}
{% block title %}Join · Northside Gym{% endblock %}
{% block content %}
<div class="card">
  <h1>Join Northside Gym</h1>
  <form method="post">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" required maxlength="80">

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required maxlength="120">

    <label for="password">Password (at least 8 characters)</label>
    <input id="password" name="password" type="password" required minlength="8">

    <label for="plan_id">Membership plan</label>
    <select id="plan_id" name="plan_id" required>
      {% for p in plans %}
        <option value="{{ p.id }}">{{ p.name }} · £{{ p.monthly_price }} a month</option>
      {% endfor %}
    </select>

    <button class="btn">Create account</button>
    <p class="demo">Demo only: this site is HTTP, so use a made-up email and password.</p>
  </form>
  <p>Already a member? <a href="{{ url_for('login') }}">Log in</a></p>
</div>
{% endblock %}

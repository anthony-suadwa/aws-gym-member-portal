<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Northside Gym{% endblock %}</title>
  <style>
    :root { --ink:#1d2433; --muted:#5b6475; --line:#d9dde5; --bg:#f5f6f8; --card:#fff; --accent:#0f766e; --warn:#9a3412; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
    header { background:var(--ink); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
    header a, header button { color:#fff; background:none; border:0; font:inherit; cursor:pointer; text-decoration:underline; }
    main { max-width:720px; margin:28px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px; }
    h1 { font-size:1.5rem; margin:0 0 16px; } h2 { font-size:1.1rem; margin:0 0 12px; }
    label { display:block; font-weight:600; margin:12px 0 4px; }
    input, select { width:100%; padding:10px; border:1px solid var(--line); border-radius:6px; font:inherit; }
    .btn { margin-top:16px; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px 16px; font:inherit; font-weight:600; cursor:pointer; }
    .flash { background:#fff7ed; border:1px solid #fed7aa; color:var(--warn); padding:10px 14px; border-radius:6px; margin-bottom:16px; }
    .demo { font-size:.85rem; color:var(--warn); margin-top:12px; }
    dl { display:grid; grid-template-columns: 140px 1fr; gap:8px 12px; margin:0; } dt { color:var(--muted); } dd { margin:0; }
    table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:8px 0; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; font-size:.9rem; }
    .muted { color:var(--muted); }
    footer { text-align:center; color:var(--muted); font-size:.8rem; padding:24px; }
  </style>
</head>
<body>
  <header>
    <strong>Northside Gym</strong>
    {% if session.member_id %}
      <form method="post" action="{{ url_for('logout') }}" style="margin:0"><button>Log out</button></form>
    {% endif %}
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>Demo site, mock data only · served by {{ server_name }}</footer>
</body>
</html>
